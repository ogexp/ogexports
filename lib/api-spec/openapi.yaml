openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 1.0.0
  description: OG Exports investor and administrator API, generated from the Laravel API contract
servers:
  - url: /api
    description: Base API path
tags:
  - name: auth
    description: Mobile authentication
  - name: investor
    description: Investor portfolio, opportunities, wallet, KYC and account
  - name: communication
    description: Notifications, conversations and support
  - name: admin
    description: OG Exports staff management operations
paths:
  /auth/mobile/login:
    post:
      operationId: investorMobileLogin
      tags: [auth]
      summary: Sign in with an email address and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JsonObject" }
      responses:
        "200": { description: Signed-in investor account and session, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
        "422": { description: Validation error, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /auth/register:
    post:
      operationId: investorRegister
      tags: [auth]
      summary: Create an investor account and send email verification
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JsonObject" }
      responses:
        "201": { description: Created investor account; email verification is required before sign-in, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
        "503": { description: Account created but verification email could not be delivered, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
        "422": { description: Validation error, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /auth/mobile/verify-email:
    post:
      operationId: investorVerifyEmail
      tags: [auth]
      summary: Verify an investor email address
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JsonObject" }
      responses:
        "200": { description: Verification result, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /auth/mobile/resend-verification:
    post:
      operationId: investorResendEmailVerification
      tags: [auth]
      summary: Resend an investor email verification code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JsonObject" }
      responses:
        "200": { description: Generic verification email result, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
        "429": { description: Code request rate limit, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /auth/mobile/2fa/verify:
    post:
      operationId: investorVerifyTwoFactor
      tags: [auth]
      summary: Complete two-factor sign-in
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JsonObject" }
      responses:
        "200": { description: Verification result, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /auth/forgot-password:
    post:
      operationId: investorForgotPassword
      tags: [auth]
      summary: Request a password reset code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JsonObject" }
      responses:
        "200": { description: Reset request result, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /auth/verify-reset-otp:
    post:
      operationId: investorVerifyResetCode
      tags: [auth]
      summary: Verify a password reset code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JsonObject" }
      responses:
        "200": { description: Verification result, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /auth/reset-password:
    post:
      operationId: investorResetPassword
      tags: [auth]
      summary: Set a new account password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JsonObject" }
      responses:
        "200": { description: Password reset result, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /auth/mobile/logout:
    post:
      operationId: investorMobileLogout
      tags: [auth]
      summary: End the investor mobile session
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: Logout result, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /me:
    get:
      operationId: getInvestorMe
      tags: [investor]
      summary: Get the signed-in user
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: User resource, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
    put:
      operationId: updateInvestorMe
      tags: [investor]
      summary: Update signed-in user profile
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvestorProfileUpdate" }
      responses:
        "200": { description: Updated user, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /me/password:
    put:
      operationId: updateInvestorPassword
      tags: [investor]
      summary: Change account password
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JsonObject" }
      responses:
        "200": { description: Password update result, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /me/sessions:
    get:
      operationId: getInvestorSessions
      tags: [investor]
      summary: List account sessions
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: Account sessions, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /me/sessions/others:
    delete:
      operationId: revokeOtherInvestorSessions
      tags: [investor]
      summary: Revoke other account sessions
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: Revoked sessions result, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /me/sessions/{id}:
    delete:
      operationId: revokeInvestorSession
      tags: [investor]
      summary: Revoke an account session
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Revocation result, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /me/audit-logs:
    get:
      operationId: getInvestorSecurityActivity
      tags: [investor]
      summary: List recent account security activity
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: Security activity, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /me/2fa:
    get:
      operationId: getInvestorTwoFactorStatus
      tags: [investor]
      summary: Get two-factor authentication status
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: Two-factor status, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /me/2fa/enable:
    post:
      operationId: enableInvestorTwoFactor
      tags: [investor]
      summary: Request two-factor authentication setup
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JsonObject" }
      responses:
        "200": { description: Verification code requested, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /me/2fa/confirm:
    post:
      operationId: confirmInvestorTwoFactor
      tags: [investor]
      summary: Confirm two-factor authentication setup
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JsonObject" }
      responses:
        "200": { description: Two-factor enabled, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /me/2fa/disable:
    post:
      operationId: disableInvestorTwoFactor
      tags: [investor]
      summary: Disable two-factor authentication
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JsonObject" }
      responses:
        "200": { description: Two-factor disabled, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /settings:
    get:
      operationId: getPublicInvestorAppSettings
      tags: [investor]
      summary: Get public site and platform settings
      responses:
        "200": { description: Public settings, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /investor/security/transaction-password:
    get:
      operationId: getInvestorTransactionPasswordStatus
      tags: [investor]
      summary: Get transaction-password setup status
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: Transaction-password status, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /investor/security/transaction-password/set:
    post:
      operationId: setInvestorTransactionPassword
      tags: [investor]
      summary: Set an investor transaction password
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JsonObject" }
      responses:
        "200": { description: Update result, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /investor/security/transaction-password/reset:
    post:
      operationId: resetInvestorTransactionPassword
      tags: [investor]
      summary: Reset an investor transaction password
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JsonObject" }
      responses:
        "200": { description: Update result, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /investor/dashboard:
    get:
      operationId: getInvestorDashboard
      tags: [investor]
      summary: Get investor dashboard summary
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: Dashboard data, content: { application/json: { schema: { $ref: "#/components/schemas/InvestorDashboardResponse" } } } }
  /investor/projects:
    get:
      operationId: getInvestorProjects
      tags: [investor]
      summary: List investment opportunities
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string } }
        - { name: per_page, in: query, schema: { type: integer } }
      responses:
        "200": { description: Opportunity list, content: { application/json: { schema: { $ref: "#/components/schemas/InvestorProjectListResponse" } } } }
  /investor/projects/{id}:
    get:
      operationId: getInvestorProject
      tags: [investor]
      summary: Get an investment opportunity
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "Opportunity detail, including the reported container record when available", content: { application/json: { schema: { $ref: "#/components/schemas/InvestorProjectDetailResponse" } } } }
  /investor/projects/{id}/invest:
    post:
      operationId: investInProject
      tags: [investor]
      summary: Create an investment in a project
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvestorProjectInvestmentRequest" }
      responses:
        "201": { description: Server-confirmed investment record and updated project capacity, content: { application/json: { schema: { $ref: "#/components/schemas/InvestorProjectInvestmentResponse" } } } }
  /investor/investments:
    get:
      operationId: getInvestorInvestments
      tags: [investor]
      summary: List the investor portfolio
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: type, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200": { description: Portfolio positions, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /investor/investments/{id}:
    get:
      operationId: getInvestorInvestment
      tags: [investor]
      summary: Get a portfolio position
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "Portfolio position detail with its associated project and reported container record when available", content: { application/json: { schema: { $ref: "#/components/schemas/InvestorInvestmentDetailResponse" } } } }
  /admin/investment-payout-progress:
    get:
      operationId: getAdminInvestmentPayoutProgress
      tags: [admin]
      summary: List active and completed investments with payout progress
      security: [{ AdminBearerAuth: [] }]
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: project_type, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200": { description: Paginated payout progress, content: { application/json: { schema: { $ref: "#/components/schemas/AdminInvestmentPayoutProgressPage" } } } }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonObject" }
        "403":
          description: OG Exports administrator access required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonObject" }
  /admin/investment-payout-progress/{investmentId}:
    patch:
      operationId: updateAdminInvestmentPayoutProgress
      tags: [admin]
      summary: Set or clear pre-payment payout progress for an active investment
      security: [{ AdminBearerAuth: [] }]
      parameters:
        - { name: investmentId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvestmentPayoutProgressUpdate" }
      responses:
        "200": { description: Updated payout progress; distributed is returned only for a confirmed timestamp, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonObject" }
        "403":
          description: OG Exports administrator access required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonObject" }
        "422":
          description: Invalid payout progress or a confirmed payout cannot be edited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonObject" }
  /investor/wallet:
    get:
      operationId: getInvestorWallet
      tags: [investor]
      summary: Get investor wallet balances
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: Wallet, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /investor/wallet/transactions:
    get:
      operationId: getInvestorWalletTransactions
      tags: [investor]
      summary: List wallet transactions
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200": { description: Wallet ledger, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /investor/wallet/transactions/{id}:
    get:
      operationId: getInvestorWalletTransaction
      tags: [investor]
      summary: Get one wallet transaction owned by the authenticated investor
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Wallet transaction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonObject" }
        "404":
          description: Transaction not found for this investor
  /investor/wallet/exchange-rates:
    get:
      operationId: getInvestorExchangeRates
      tags: [investor]
      summary: Get supported currency exchange rates
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: Rates, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /investor/deposit-options:
    get:
      operationId: getInvestorDepositOptions
      tags: [investor]
      summary: List available deposit methods
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: Deposit options, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /investor/payment-bank-accounts:
    get:
      operationId: getInvestorPaymentBankAccounts
      tags: [investor]
      summary: List platform bank accounts for deposits
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: Platform accounts, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /investor/deposits:
    get:
      operationId: getInvestorDeposits
      tags: [investor]
      summary: List investor deposits
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200": { description: Deposits, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
    post:
      operationId: createInvestorDeposit
      tags: [investor]
      summary: Submit a deposit
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JsonObject" }
      responses:
        "201": { description: Deposit created, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /investor/withdrawals:
    get:
      operationId: getInvestorWithdrawals
      tags: [investor]
      summary: List investor withdrawals
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200": { description: Withdrawals, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
    post:
      operationId: createInvestorWithdrawal
      tags: [investor]
      summary: Submit a withdrawal request
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvestorWithdrawalInput" }
      responses:
        "201": { description: Withdrawal created, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /investor/bank-accounts:
    get:
      operationId: getInvestorBankAccounts
      tags: [investor]
      summary: List masked investor bank accounts and server-owned verification states
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: Masked bank accounts and current OG Exports review results, content: { application/json: { schema: { $ref: "#/components/schemas/InvestorBankAccountsResponse" } } } }
    post:
      operationId: createInvestorBankAccount
      tags: [investor]
      summary: Submit a bank account and private proof document for review
      description: The proof is stored outside the public web directory. Verification state is assigned only by the server after administrator review.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/InvestorBankAccountInput" }
      responses:
        "201": { description: Bank account submitted for admin review, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
        "422": { description: Invalid account details or proof file, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /investor/bank-accounts/{id}/default:
    patch:
      operationId: setInvestorDefaultBankAccount
      tags: [investor]
      summary: Set a currently verified bank account as the withdrawal default
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Updated masked bank account list, content: { application/json: { schema: { $ref: "#/components/schemas/InvestorBankAccountsResponse" } } } }
        "422": { description: Account is not currently verified, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /investor/withdrawals/otp/send:
    post:
      operationId: sendInvestorWithdrawalOtp
      tags: [investor]
      summary: Email a withdrawal verification code
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: OTP delivery result, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /investor/profile:
    get:
      operationId: getInvestorProfile
      tags: [investor]
      summary: Get investor profile
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: Profile, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
    put:
      operationId: updateInvestorProfile
      tags: [investor]
      summary: Update investor profile
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JsonObject" }
      responses:
        "200": { description: Updated profile, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /investor/kyc:
    get:
      operationId: getInvestorKyc
      tags: [investor]
      summary: List investor identity-verification applications
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: per_page, in: query, schema: { type: integer } }
      responses:
        "200": { description: KYC applications, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
    post:
      operationId: submitInvestorKyc
      tags: [investor]
      summary: Submit identity-verification information
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JsonObject" }
      responses:
        "201": { description: KYC application created, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /investor/profile/kyc/upload:
    post:
      operationId: uploadInvestorKycDocument
      tags: [investor]
      summary: Attach an uploaded document to the investor KYC application
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JsonObject" }
      responses:
        "201": { description: Document and verification status, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /investor/statements:
    get:
      operationId: getInvestorStatement
      tags: [investor]
      summary: Get a monthly wallet statement
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: month, in: query, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }, description: "Month in YYYY-MM format; defaults to the current month." }
      responses:
        "200": { description: Monthly statement and available statement months, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /investor/statements/{month}/pdf:
    get:
      operationId: downloadInvestorStatementPdf
      tags: [investor]
      summary: Download a monthly wallet statement PDF
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: month, in: path, required: true, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
      responses:
        "200":
          description: Generated monthly statement PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
  /investor/reports:
    get:
      operationId: getInvestorReports
      tags: [investor]
      summary: List investor reports
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: Reports, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
    post:
      operationId: createInvestorReport
      tags: [investor]
      summary: Generate an investor report
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JsonObject" }
      responses:
        "200": { description: Generated report, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /investor/notifications:
    get:
      operationId: getInvestorNotifications
      tags: [communication]
      summary: List investor notifications
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: Notifications with server-classified categories, content: { application/json: { schema: { $ref: "#/components/schemas/InvestorNotificationsResponse" } } } }
  /investor/push-tokens/register:
    post:
      operationId: registerInvestorPushToken
      tags: [communication]
      summary: Register a push token for the signed-in device
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvestorPushTokenRegistration" }
      responses:
        "200": { description: Push token registered, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
        "401": { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
        "422": { description: Invalid push token, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /investor/push-tokens/revoke:
    post:
      operationId: revokeInvestorPushToken
      tags: [communication]
      summary: Disable push delivery for the signed-in device
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvestorPushTokenRevocation" }
      responses:
        "200": { description: Push token revoked, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
        "401": { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /internal/investor-payout-progress:
    post:
      operationId: receiveInternalInvestorPayoutProgress
      tags: [communication]
      summary: Deliver a signed payout progress event to opted-in investor devices
      description: Internal Laravel-to-API-Server bridge. Requests require a timestamped HMAC signature.
      x-internal: true
      parameters:
        - name: X-OG-Payout-Timestamp
          in: header
          required: true
          schema: { type: string, pattern: "^[0-9]{10}$" }
        - name: X-OG-Payout-Signature
          in: header
          required: true
          schema: { type: string, pattern: "^sha256=[a-f0-9]{64}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayoutProgressPushEvent" }
      responses:
        "200": { description: Event recorded and push delivery attempted, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
        "202": { description: The same event is already being delivered, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
        "401": { description: "Missing, invalid, or expired request signature", content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
        "422": { description: Invalid payout event, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
        "502": { description: Push delivery failed and may be retried with the same event id, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /investor/notifications/unread-count:
    get:
      operationId: getInvestorUnreadNotificationCount
      tags: [communication]
      summary: Get unread notification count
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: Unread count, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /investor/notifications/read-all:
    post:
      operationId: markAllInvestorNotificationsRead
      tags: [communication]
      summary: Mark all investor notifications as read
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: Update result, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /investor/notifications/{id}/read:
    post:
      operationId: markInvestorNotificationRead
      tags: [communication]
      summary: Mark an investor notification as read
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Notification marked as read, content: { application/json: { schema: { $ref: "#/components/schemas/InvestorNotificationResponse" } } } }
  /conversations/with-admin:
    get:
      operationId: getInvestorAdminConversation
      tags: [communication]
      summary: Get or create the investor support conversation
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: Conversation, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /conversations/{conversation}/messages:
    get:
      operationId: getInvestorConversationMessages
      tags: [communication]
      summary: List support conversation messages
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: conversation, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Messages, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
    post:
      operationId: sendInvestorConversationMessage
      tags: [communication]
      summary: Send a support conversation message
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: conversation, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JsonObject" }
      responses:
        "201": { description: Message created, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /support/tickets:
    get:
      operationId: getInvestorSupportTickets
      tags: [communication]
      summary: List support tickets
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: Tickets, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
    post:
      operationId: createInvestorSupportTicket
      tags: [communication]
      summary: Create a support ticket
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JsonObject" }
      responses:
        "201": { description: Ticket created, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /auth/login:
    post:
      operationId: adminSessionLogin
      tags: [auth]
      summary: Sign in through the Laravel web session flow
      description: Establishes the existing Laravel session cookie. Browser clients must first request /sanctum/csrf-cookie and send its XSRF token.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminLoginCredentials" }
      responses:
        "200": { description: Signed-in user or required two-factor challenge, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
        "403": { description: Account requires verification, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
        "422": { description: Invalid credentials or validation error, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /auth/2fa/verify:
    post:
      operationId: adminSessionTwoFactorVerify
      tags: [auth]
      summary: Complete a Laravel web-session two-factor challenge
      description: Completes the existing email-code challenge and establishes the Laravel session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminTwoFactorChallenge" }
      responses:
        "200": { description: Signed-in user, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
        "422": { description: Invalid or expired code, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /auth/2fa/resend:
    post:
      operationId: adminSessionTwoFactorResend
      tags: [auth]
      summary: Resend a Laravel web-session two-factor code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminTwoFactorResend" }
      responses:
        "200": { description: Code delivery result, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
        "422": { description: Invalid login challenge, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /auth/logout:
    post:
      operationId: adminSessionLogout
      tags: [auth]
      summary: End the Laravel web session
      description: Logs out of the existing Laravel admin session and invalidates its session cookie.
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: Logged out, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
        "401": { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /admin/investment-projects:
    get:
      operationId: getAdminInvestmentProjects
      tags: [admin]
      summary: List investment projects for container tracking administration
      description: Only authenticated OG Exports administrators can access this project list. Filter by type=container to show container trades.
      security: [{ AdminBearerAuth: [] }]
      parameters:
        - { name: type, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200": { description: Paginated project records from Laravel, content: { application/json: { schema: { $ref: "#/components/schemas/AdminProjectListResponse" } } } }
        "401": { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
        "403": { description: OG Exports administrator access required, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /admin/compliance/bank-accounts:
    get:
      operationId: getAdminInvestorBankAccounts
      tags: [admin]
      summary: List investor bank account proof submissions for admin review
      security: [{ AdminBearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, verified, rejected, all] } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200": { description: Paginated bank review queue with masked account identifiers, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /admin/compliance/bank-accounts/{verification}/proof:
    get:
      operationId: getAdminInvestorBankAccountProof
      tags: [admin]
      summary: View a privately stored investor bank proof document
      security: [{ AdminBearerAuth: [] }]
      parameters:
        - { name: verification, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { description: Private proof document, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "404": { description: Proof document not found, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /admin/compliance/bank-accounts/{verification}/approve:
    post:
      operationId: approveAdminInvestorBankAccount
      tags: [admin]
      summary: Mark a current pending bank account as verified
      security: [{ AdminBearerAuth: [] }]
      parameters:
        - { name: verification, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankAccountReviewInput" }
      responses:
        "200": { description: Review decision saved, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
        "409": { description: Account details changed or submission was already reviewed, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /admin/compliance/bank-accounts/{verification}/reject:
    post:
      operationId: rejectAdminInvestorBankAccount
      tags: [admin]
      summary: Reject a pending bank account proof submission with a reason
      security: [{ AdminBearerAuth: [] }]
      parameters:
        - { name: verification, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankAccountReviewInput" }
      responses:
        "200": { description: Review decision saved, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
        "409": { description: Submission was already reviewed, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /admin/projects/{id}/container-tracking:
    get:
      operationId: getAdminProjectContainerTracking
      tags: [admin]
      summary: Read a project's reported container record
      description: Only OG Exports administrators can access this record. A missing record returns 404; no shipment status is inferred.
      security: [{ AdminBearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Current admin-managed container details and all six journey stages, content: { application/json: { schema: { $ref: "#/components/schemas/ContainerTracking" } } } }
        "401": { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
        "403": { description: OG Exports administrator access required, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
        "404": { description: Project or container record not found, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
    patch:
      operationId: updateAdminProjectContainerTracking
      tags: [admin]
      summary: Create or publish admin-reported container details and journey stages
      description: Only OG Exports administrators can update the project record. The first update creates it; later updates merge supplied fields, initialize all six stages as unreported, and set tracking_updated_at on the server. Clients cannot set that timestamp and no carrier position or progress is inferred.
      security: [{ AdminBearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContainerTrackingUpdate" }
      responses:
        "200": { description: Updated admin-managed record with server-owned tracking timestamp, content: { application/json: { schema: { $ref: "#/components/schemas/ContainerTracking" } } } }
        "401": { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
        "403": { description: OG Exports administrator access required, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
        "404": { description: Project not found, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
        "422": { description: Invalid container record or journey stage, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /admin/projects/{id}/updates:
    get:
      operationId: getAdminProjectTradeUpdates
      tags: [admin]
      summary: List reported trade updates for an investment project
      security: [{ AdminBearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Chronological OG Exports-reported updates, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectTradeUpdateList" } } } }
        "401": { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
        "403": { description: OG Exports administrator access required, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
        "404": { description: Project not found, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
    post:
      operationId: createAdminProjectTradeUpdate
      tags: [admin]
      summary: Publish an OG Exports-reported trade update
      description: Appends a project update with its administrator-supplied event time, status, description, and optional PDF or image attachment.
      security: [{ AdminBearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/ProjectTradeUpdateInput" }
      responses:
        "201": { description: Published update, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectTradeUpdateResponse" } } } }
        "401": { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
        "403": { description: OG Exports administrator access required, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
        "404": { description: Project not found, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
        "422": { description: Invalid update or attachment, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /admin/projects/{id}/stage-updates:
    get:
      operationId: getAdminProjectStageUpdates
      tags: [admin]
      summary: List explicit milestone updates for a container project
      description: Returns append-only admin records. These records are separate from the project's general trade update feed.
      security: [{ AdminBearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Stage updates ordered by server creation time, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectStageUpdateList" } } } }
        "401": { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
        "403": { description: OG Exports administrator access required, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
        "404": { description: Project not found, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
    post:
      operationId: createAdminProjectStageUpdate
      tags: [admin]
      summary: Record an explicit status update for one container milestone
      description: Appends an admin-authored milestone status, description, and event time. No other milestone state is inferred or changed.
      security: [{ AdminBearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminProjectStageUpdateInput" }
      responses:
        "201": { description: Recorded milestone update, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectStageUpdateResponse" } } } }
        "401": { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
        "403": { description: OG Exports administrator access required, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
        "404": { description: Project not found, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
        "422": { description: Invalid stage update or non-container project, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /investor/projects/{id}/updates/{updateId}/attachment:
    get:
      operationId: downloadInvestorProjectTradeUpdateAttachment
      tags: [investor]
      summary: Download a supporting file for a trade update
      security: [{ InvestorBearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: updateId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Supporting PDF or image
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
        "404": { description: "Project, update, or attachment not found", content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
components:
  schemas:
    ProjectStageUpdate:
      type: object
      additionalProperties: false
      required: [id, stage, status, description, occurred_at, created_at]
      properties:
        id: { type: integer, readOnly: true }
        stage:
          type: string
          enum: [funding, investment_confirmed, cargo_loaded, in_transit, custom_clearance, settled]
        status:
          type: string
          enum: [not_started, in_progress, completed]
        description: { type: string }
        occurred_at:
          type: string
          format: date-time
          description: Event time explicitly entered by the administrator.
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Server-owned time when the record was created.
    AdminProjectStageUpdateInput:
      type: object
      additionalProperties: false
      required: [stage, status, description, occurred_at]
      properties:
        stage:
          type: string
          enum: [funding, investment_confirmed, cargo_loaded, in_transit, custom_clearance, settled]
        status:
          type: string
          enum: [not_started, in_progress, completed]
        description: { type: string, minLength: 1, maxLength: 5000 }
        occurred_at:
          type: string
          format: date-time
          description: Required event time entered by the administrator; never defaulted from a device clock.
    ProjectStageUpdateList:
      type: object
      additionalProperties: true
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ProjectStageUpdate" }
    ProjectStageUpdateResponse:
      type: object
      additionalProperties: true
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/ProjectStageUpdate"
    InvestmentPeriodProgress:
      type: object
      additionalProperties: false
      required: [days_elapsed, total_days, progress_percent]
      properties:
        days_elapsed: { type: integer, minimum: 0 }
        total_days: { type: integer, minimum: 1 }
        progress_percent: { type: number, minimum: 0, maximum: 100 }
    ProjectTradeUpdate:
      type: object
      additionalProperties: false
      required: [id, status, description, occurred_at, attachment_url, attachment_name, attachment_mime, attachment_size_bytes]
      properties:
        id: { type: integer }
        status: { type: string }
        description: { type: string }
        occurred_at: { type: string, format: date-time }
        attachment_url: { type: ["string", "null"] }
        attachment_name: { type: ["string", "null"] }
        attachment_mime: { type: ["string", "null"] }
        attachment_size_bytes: { type: ["integer", "null"], minimum: 0 }
        created_at: { type: ["string", "null"], format: date-time }
    ProjectTradeUpdateInput:
      type: object
      additionalProperties: false
      required: [status, description, occurred_at]
      properties:
        status: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, minLength: 1, maxLength: 5000 }
        occurred_at: { type: string, format: date-time }
        attachment:
          type: string
          format: binary
          description: Optional PDF, JPEG, PNG, or WebP file up to 10 MB.
    ProjectTradeUpdateList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ProjectTradeUpdate" }
    ProjectTradeUpdateResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/ProjectTradeUpdate" }
    AdminLoginCredentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
        remember: { type: boolean }
    AdminTwoFactorChallenge:
      type: object
      additionalProperties: false
      required: [token, code]
      properties:
        token: { type: string, minLength: 1 }
        code: { type: string, minLength: 6, maxLength: 6 }
        remember: { type: boolean }
    AdminTwoFactorResend:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 1 }
    AdminInvestmentProjectSummary:
      type: object
      additionalProperties: true
      required: [id, title]
      properties:
        id: { type: integer }
        title: { type: string }
        reference: { type: ["string", "null"] }
        type: { type: ["string", "null"] }
        status: { type: ["string", "null"] }
        commodity: { type: ["string", "null"] }
        origin: { type: ["string", "null"] }
        destination: { type: ["string", "null"] }
        vessel: { type: ["string", "null"] }
        etd: { type: ["string", "null"] }
        eta: { type: ["string", "null"] }
    AdminProjectListResponse:
      type: object
      additionalProperties: true
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/AdminInvestmentProjectSummary" }
        links: { type: object, additionalProperties: true }
        meta: { type: object, additionalProperties: true }
    JourneyStage:
      type: object
      description: An OG Exports-reported journey stage. Null values mean the information has not been reported.
      additionalProperties: false
      required: [status, date, details]
      properties:
        status:
          type: [string, "null"]
          maxLength: 80
          description: Status text explicitly supplied by OG Exports; never calculated from other stages.
        date:
          type: [string, "null"]
          maxLength: 64
          description: Date or ISO 8601 timestamp explicitly supplied by OG Exports.
        details:
          type: [string, "null"]
          maxLength: 1000
          description: Stage description explicitly supplied by OG Exports.
    ContainerJourney:
      type: object
      description: The six fixed trade stages, each independently reported by OG Exports.
      additionalProperties: false
      required: [origin, port, vessel, destination, buyer, settlement]
      properties:
        origin: { $ref: "#/components/schemas/JourneyStage" }
        port: { $ref: "#/components/schemas/JourneyStage" }
        vessel: { $ref: "#/components/schemas/JourneyStage" }
        destination: { $ref: "#/components/schemas/JourneyStage" }
        buyer: { $ref: "#/components/schemas/JourneyStage" }
        settlement: { $ref: "#/components/schemas/JourneyStage" }
    JourneyStageUpdate:
      type: object
      description: Partial admin update for one journey stage. Omitted values remain unchanged; null clears a reported value.
      additionalProperties: false
      minProperties: 1
      properties:
        status:
          type: [string, "null"]
          maxLength: 80
        date:
          type: [string, "null"]
          maxLength: 64
        details:
          type: [string, "null"]
          maxLength: 1000
    ContainerJourneyUpdate:
      type: object
      description: Partial update of one or more named journey stages; stage order does not imply progress.
      additionalProperties: false
      minProperties: 1
      properties:
        origin: { $ref: "#/components/schemas/JourneyStageUpdate" }
        port: { $ref: "#/components/schemas/JourneyStageUpdate" }
        vessel: { $ref: "#/components/schemas/JourneyStageUpdate" }
        destination: { $ref: "#/components/schemas/JourneyStageUpdate" }
        buyer: { $ref: "#/components/schemas/JourneyStageUpdate" }
        settlement: { $ref: "#/components/schemas/JourneyStageUpdate" }
    ContainerTracking:
      type: object
      description: Admin-reported container record. No field represents a live carrier position.
      additionalProperties: false
      required: [container_journey, tracking_updated_at]
      properties:
        container_number:
          type: [string, "null"]
          maxLength: 80
        bill_of_lading_number:
          type: [string, "null"]
          maxLength: 120
        vessel_name:
          type: [string, "null"]
          maxLength: 160
        port_of_loading:
          type: [string, "null"]
          maxLength: 160
        destination_port:
          type: [string, "null"]
          maxLength: 160
        etd:
          type: [string, "null"]
          maxLength: 64
          description: Estimated departure date as supplied by OG Exports.
        eta:
          type: [string, "null"]
          maxLength: 64
          description: Estimated arrival date as supplied by OG Exports.
        latest_tracking_update:
          type: [string, "null"]
          maxLength: 1000
          description: Admin-authored update text; not a carrier event unless separately integrated.
        trade_status:
          type: [string, "null"]
          maxLength: 80
          description: Status explicitly supplied by OG Exports.
        container_journey:
          $ref: "#/components/schemas/ContainerJourney"
        tracking_updated_at:
          type: string
          format: date-time
          readOnly: true
          description: Set by the server when an admin publishes an update; never supplied by the client.
    ContainerTrackingUpdate:
      type: object
      description: Admin-authored partial update. The server preserves omitted values and owns tracking_updated_at.
      additionalProperties: false
      minProperties: 1
      properties:
        container_number:
          type: [string, "null"]
          maxLength: 80
        bill_of_lading_number:
          type: [string, "null"]
          maxLength: 120
        vessel_name:
          type: [string, "null"]
          maxLength: 160
        port_of_loading:
          type: [string, "null"]
          maxLength: 160
        destination_port:
          type: [string, "null"]
          maxLength: 160
        etd:
          type: [string, "null"]
          maxLength: 64
        eta:
          type: [string, "null"]
          maxLength: 64
        latest_tracking_update:
          type: [string, "null"]
          maxLength: 1000
        trade_status:
          type: [string, "null"]
          maxLength: 80
        container_journey:
          $ref: "#/components/schemas/ContainerJourneyUpdate"
    InvestorProjectDetail:
      type: object
      description: Opportunity or investment detail fields with reported container details and append-only OG Exports trade updates when available.
      additionalProperties: true
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
        reference:
          type: [string, "null"]
        type:
          type: string
        status:
          type: string
        currency:
          type: [string, "null"]
          description: Investment denomination. Container investments are entered in USD; PKR-wallet conversion is calculated by the server.
        target_amount:
          type: [number, "null"]
        raised_amount:
          type: [number, "null"]
        funding_percentage:
          type: [number, "null"]
          description: Funding percentage explicitly returned by OG Exports.
        remaining_amount:
          type: [number, "null"]
          description: Remaining capacity explicitly returned by OG Exports.
        min_investment:
          type: [number, "null"]
        max_investment:
          type: [number, "null"]
        expected_return_pct:
          type: [number, "null"]
          description: Return target explicitly supplied by OG Exports; not a guarantee.
        investment_period_days:
          type: [integer, "null"]
        commodity:
          type: [string, "null"]
        container:
          $ref: "#/components/schemas/ContainerTracking"
        trade_updates:
          type: array
          description: Persisted events explicitly published by OG Exports. Empty when no project updates have been recorded.
          items:
            $ref: "#/components/schemas/ProjectTradeUpdate"
        stage_updates:
          type: array
          description: Append-only admin records for the six standard container milestones. Status is taken only from the latest explicit record for each stage; no status is inferred.
          items:
            $ref: "#/components/schemas/ProjectStageUpdate"
        project:
          type: object
          description: Associated project record included with a portfolio position.
          additionalProperties: true
          properties:
            container:
              $ref: "#/components/schemas/ContainerTracking"
            trade_updates:
              type: array
              description: Persisted events explicitly published by OG Exports for this position's project.
              items:
                $ref: "#/components/schemas/ProjectTradeUpdate"
            stage_updates:
              type: array
              description: Explicit admin records for the project's standard container milestones.
              items:
                $ref: "#/components/schemas/ProjectStageUpdate"
    InvestorProjectListResponse:
      type: object
      description: Laravel paginated investment opportunity collection.
      additionalProperties: true
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/InvestorProjectDetail"
    InvestorProjectInvestmentRequest:
      type: object
      additionalProperties: false
      required: [amount]
      properties:
        amount:
          type: number
          minimum: 1
          description: Investment amount in the opportunity's reported investment currency.
    InvestorProjectInvestmentResponse:
      type: object
      additionalProperties: true
      required: [message, data, capacity]
      properties:
        message:
          type: string
        data:
          type: object
          additionalProperties: true
          required: [id, amount, amount_currency, status]
          properties:
            id:
              type: integer
            amount:
              type: number
            amount_currency:
              type: string
            amount_pkr:
              type: [number, "null"]
            exchange_rate:
              type: [number, "null"]
            status:
              type: string
            reference:
              type: [string, "null"]
            invested_at:
              type: [string, "null"]
              format: date-time
            approved_at:
              type: [string, "null"]
              format: date-time
        capacity:
          type: object
          additionalProperties: true
          required: [remaining_amount, pending_reserved, is_full, slots_remaining]
          properties:
            remaining_amount:
              type: number
            pending_reserved:
              type: number
            is_full:
              type: boolean
            slots_remaining:
              type: [integer, "null"]
    InvestorProjectDetailResponse:
      type: object
      description: Laravel project resource response envelope.
      additionalProperties: true
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/InvestorProjectDetail"
    AdminInvestmentPayoutProgress:
      type: object
      additionalProperties: true
      required: [investment_id, investment_status, project_id, investor_id, invested_amount, amount_currency]
      properties:
        id:
          type: integer
        investment_id:
          type: integer
        investment_reference:
          type: ["string", "null"]
        investment_status:
          type: string
        project_id:
          type: integer
        project_title:
          type: ["string", "null"]
        project_type:
          type: ["string", "null"]
        investor_id:
          type: integer
        investor_name:
          type: ["string", "null"]
        investor_email:
          type: ["string", "null"]
        invested_amount:
          type: number
        amount_currency:
          type: string
        profit_amount:
          type: ["number", "null"]
        total_return:
          type: ["number", "null"]
        payout_status:
          type: ["string", "null"]
          enum: [scheduled, processing, distributed, null]
        planned_distribution_date:
          type: ["string", "null"]
          format: date
        distributed_at:
          type: ["string", "null"]
          format: date-time
    AdminInvestmentPayoutProgressPage:
      type: object
      additionalProperties: true
      required: [data, current_page, last_page, per_page, total]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminInvestmentPayoutProgress"
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
    InvestmentPayoutProgressUpdate:
      type: object
      additionalProperties: false
      required: [status, planned_distribution_date]
      properties:
        status:
          type: ["string", "null"]
          enum: [scheduled, processing, null]
        planned_distribution_date:
          type: ["string", "null"]
          format: date
    InvestorInvestmentDetail:
      type: object
      description: Investor position fields and its Laravel project resource.
      additionalProperties: true
      required: [project]
      properties:
        project:
          $ref: "#/components/schemas/InvestorProjectDetail"
        expected_profit:
          type: number
          description: Server-calculated expected profit in the investment currency, using invested amount multiplied by the project's reported ROI percentage.
        expected_profit_pkr:
          type: ["number", "null"]
          description: Server-calculated expected profit for the PKR investment amount, using the project's reported ROI percentage.
        profit_distribution:
          anyOf:
            - type: object
              additionalProperties: true
              properties:
                status: { type: ["string", "null"], description: "Scheduled or processing before payment; distributed only when a confirmed distribution timestamp is recorded." }
                planned_distribution_date: { type: ["string", "null"], format: date }
                distributed_at: { type: ["string", "null"], format: date-time }
            - type: "null"
        investment_period_progress:
          anyOf:
            - $ref: "#/components/schemas/InvestmentPeriodProgress"
            - type: "null"
          description: Server-computed elapsed investment period; null unless the investment date and configured period are both available.
    InvestorInvestmentDetailResponse:
      type: object
      description: Laravel investor investment resource envelope.
      additionalProperties: true
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/InvestorInvestmentDetail"
    InvestorDashboardSummary:
      type: object
      description: Financial summary amounts are denominated in display_currency.
      additionalProperties: true
      required: [total_portfolio_value, distributed_returns, pending_distribution, display_currency]
      properties:
        total_portfolio_value:
          type: number
          description: Current pending and active investment principal, available and reserved wallet balances, and explicit pending distributions; completed investments are excluded because their return is credited to the wallet.
        distributed_returns:
          type: number
          description: Confirmed profit amounts from investor distribution records with a distributed_at timestamp.
        pending_distribution:
          type: number
          description: Sum of pending credit ledger entries explicitly typed as profit, distribution, or dividend; forecast payouts are excluded.
        display_currency:
          type: string
          description: Currency used for all financial summary amounts, matching the investor wallet currency.
    InvestorDashboardData:
      type: object
      additionalProperties: true
      required: [summary, wallet]
      properties:
        summary:
          $ref: "#/components/schemas/InvestorDashboardSummary"
        wallet:
          type: object
          additionalProperties: true
          required: [currency]
          properties:
            currency:
              type: string
              description: Currency used for wallet balances.
    InvestorDashboardResponse:
      type: object
      additionalProperties: true
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/InvestorDashboardData"
    InvestorNotification:
      type: object
      additionalProperties: true
      required: [id, type, category, title, created_at]
      properties:
        id: { type: integer }
        type: { type: string }
        category:
          type: string
          enum: [Trade, Investment, Wallet, KYC, Security, Account]
        title: { type: string }
        body: { type: ["string", "null"] }
        data: { type: ["object", "null"], additionalProperties: true }
        read_at: { type: ["string", "null"], format: date-time }
        created_at: { type: string, format: date-time }
    InvestorNotificationResponse:
      type: object
      additionalProperties: true
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/InvestorNotification"
    InvestorNotificationsResponse:
      type: object
      additionalProperties: true
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/InvestorNotification" }
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        links: { type: array, items: { type: object, additionalProperties: true } }
        meta: { type: object, additionalProperties: true }
    InvestorPushTokenRegistration:
      type: object
      required: [expo_push_token, platform]
      properties:
        expo_push_token:
          type: string
          minLength: 20
          maxLength: 256
          pattern: "^Expo(nent)?PushToken\\[[A-Za-z0-9._-]+\\]$"
        platform:
          type: string
          enum: [ios, android]
    InvestorPushTokenRevocation:
      type: object
      required: [expo_push_token]
      properties:
        expo_push_token:
          type: string
          minLength: 20
          maxLength: 256
          pattern: "^Expo(nent)?PushToken\\[[A-Za-z0-9._-]+\\]$"
    PayoutProgressPushEvent:
      type: object
      required: [event_id, investor_email, investment_id, investment_reference, project_name, status, planned_date]
      properties:
        event_id: { type: string, format: uuid }
        investor_email: { type: string, format: email, maxLength: 255 }
        investment_id: { type: string, pattern: "^[1-9][0-9]{0,19}$" }
        investment_reference: { type: string, minLength: 1, maxLength: 120 }
        project_name: { type: string, minLength: 1, maxLength: 200 }
        status: { type: string, enum: [scheduled, processing] }
        planned_date: { type: string, format: date, nullable: true }
    InvestorProfileUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        mobile:
          type: string
          description: Optional mobile number with country calling code. This number is not verified by SMS.
          maxLength: 32
        country:
          type: string
          description: Optional country or region.
          maxLength: 80
    InvestorWithdrawalInput:
      type: object
      additionalProperties: true
      required: [amount, otp, transaction_password, bank_details]
      properties:
        amount: { type: number, exclusiveMinimum: 0 }
        bank_account_id:
          type: ["string", "null"]
          maxLength: 64
          deprecated: true
          description: Legacy saved-account reference. New web and mobile clients should send editable bank_details instead.
        otp: { type: string, minLength: 6, maxLength: 6 }
        transaction_password: { type: string, minLength: 1 }
        note: { type: ["string", "null"] }
        bank_details:
          type: object
          additionalProperties: false
          required: [bank_name, account_holder, account_number, currency]
          description: Payout account details entered or selected by the investor, matching the website withdrawal form.
          properties:
            bank_name: { type: string, minLength: 1, maxLength: 255 }
            account_holder: { type: string, minLength: 1, maxLength: 255 }
            account_number: { type: string, minLength: 1, maxLength: 100 }
            iban: { type: string, maxLength: 100 }
            swift: { type: string, maxLength: 50 }
            branch: { type: string, maxLength: 255 }
            purpose: { type: string, maxLength: 255 }
            currency: { type: string, minLength: 3, maxLength: 3 }
        save_bank_details: { type: boolean }
    InvestorBankAccountInput:
      type: object
      additionalProperties: false
      required: [bank_name, account_holder, currency, file]
      properties:
        bank_name: { type: string, minLength: 1, maxLength: 255 }
        account_holder: { type: string, minLength: 1, maxLength: 255 }
        account_number: { type: ["string", "null"], maxLength: 100 }
        iban: { type: ["string", "null"], maxLength: 100 }
        swift: { type: ["string", "null"], maxLength: 50 }
        branch: { type: ["string", "null"], maxLength: 255 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        file: { type: string, format: binary, description: "PDF, JPEG, PNG, or WebP up to 10 MB" }
    InvestorBankAccount:
      type: object
      required: [id, bank_name, account_holder, masked_account_identifier, currency, is_default, verification_status]
      properties:
        id: { type: string }
        bank_name: { type: string }
        account_holder: { type: string }
        masked_account_identifier: { type: ["string", "null"] }
        currency: { type: string }
        is_default: { type: boolean }
        verification_status:
          type: string
          enum: [not_submitted, pending, verified, rejected]
        verification_submitted_at: { type: ["string", "null"], format: date-time }
        verification_reviewed_at: { type: ["string", "null"], format: date-time }
        verification_notes: { type: ["string", "null"] }
        proof_name: { type: ["string", "null"] }
        has_proof: { type: boolean }
    InvestorBankAccountsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [bank_accounts]
          properties:
            bank_accounts:
              type: array
              items: { $ref: "#/components/schemas/InvestorBankAccount" }
    BankAccountReviewInput:
      type: object
      properties:
        notes: { type: ["string", "null"], maxLength: 2000 }
    JsonObject:
      type: object
      additionalProperties: true
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
    AdminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token for an authenticated OG Exports administrator; investor credentials must not authorize these routes.

