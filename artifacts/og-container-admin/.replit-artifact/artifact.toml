kind = "web"
previewPath = "/og-exports/"
title = "OG Exports Investor Portal"
description = "The OG Exports investor portal and administration console, connected to the Laravel API for investor accounts, KYC, compliance, and bank-proof review."
version = "1.0.0"
id = "artifacts/og-container-admin"
router = "path"

[[services]]
name = "web"
paths = [ "/og-exports/" ]
localPort = 22552

[services.development]
run = "pnpm --filter @workspace/og-container-admin run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/og-container-admin", "run", "build" ]
serve = "static"
publicDir = "artifacts/og-container-admin/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22552"
BASE_PATH = "/og-exports/"